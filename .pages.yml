# Formulaires de Pages CMS (https://app.pagescms.org) :
# permettent de tout modifier sans toucher au code.
media:
  input: images
  output: /images
  categories: [image]

content:
  - name: contenu
    label: Appli, logo, contacts et réseaux
    type: file
    path: config/contenu.json
    format: json
    fields:
      - name: nom
        label: Nom de l'appli
        type: string
        required: true
        description: Apparaît partout (appli, page d'accueil, icône installée)
      - name: slogan
        label: Phrase d'accroche
        type: string
      - name: syndicat
        label: Nom du syndicat
        type: string
      - name: etablissement
        label: Établissement
        type: string
      - name: couleur
        label: Couleur principale (code hexadécimal)
        type: string
        pattern: ^#[0-9A-Fa-f]{6}$
        description: Rouge CGT = #E30613
      - name: logo
        label: Logo affiché dans l'appli et sur la page d'accueil
        type: image
        description: PNG ou SVG, de préférence sur fond transparent
      - name: icone
        label: Icône de l'appli (écran d'accueil du téléphone)
        type: image
        description: Image carrée, 512 × 512 pixels ou plus
      - name: domaine
        label: Nom de domaine personnalisé (facultatif)
        type: string
        description: Ex. montemps.fr — laisser vide pour l'adresse gratuite github.io
      - name: contacts
        label: Contacts
        type: object
        fields:
          - { name: mailGeneral, label: Mail général, type: string }
          - { name: mailGreve, label: Mail pour les déclarations de grève (en copie), type: string }
          - { name: mailSignalement, label: Mail pour les signalements confidentiels, type: string }
          - { name: mailAdhesion, label: Mail pour les adhésions, type: string }
          - { name: telephone, label: Téléphone, type: string }
          - { name: adresse, label: Adresse postale, type: string }
          - { name: local, label: Emplacement du local, type: string }
          - { name: permanences, label: Horaires de permanence, type: string }
      - name: reseaux
        label: Site et réseaux sociaux (adresses complètes, commençant par https://)
        type: object
        fields:
          - { name: site, label: Site internet, type: string }
          - { name: facebook, label: Facebook, type: string }
          - { name: instagram, label: Instagram, type: string }
          - { name: whatsapp, label: WhatsApp (lien de chaîne ou de groupe), type: string }
          - { name: tiktok, label: TikTok, type: string }
          - { name: youtube, label: YouTube, type: string }
          - { name: x, label: X (Twitter), type: string }
          - { name: bluesky, label: Bluesky, type: string }
          - { name: threads, label: Threads, type: string }
          - { name: telegram, label: Telegram, type: string }
      - name: actualites
        label: Actualités
        type: object
        list: true
        fields:
          - name: date
            label: Date
            type: date
            options: { format: yyyy-MM-dd }
          - { name: titre, label: Titre, type: string, required: true }
          - { name: texte, label: Texte, type: text }
          - { name: image, label: Image (facultatif), type: image }
          - { name: lien, label: Lien « En savoir plus » (facultatif), type: string }
      - name: agenda
        label: Agenda (AG, permanences, actions)
        type: object
        list: true
        fields:
          - name: date
            label: Date
            type: date
            options: { format: yyyy-MM-dd }
          - { name: titre, label: Titre, type: string, required: true }
          - { name: lieu, label: Lieu et horaire, type: string }
      - name: liens
        label: Liens utiles (onglet Outils)
        type: object
        list: true
        fields:
          - { name: titre, label: Titre, type: string, required: true }
          - { name: url, label: Adresse (https://…), type: string, required: true }
          - { name: description, label: Description courte, type: string }
      - name: metiers
        label: Métiers proposés
        type: string
        list: true
      - name: droits
        label: Fiches « Mes droits » supplémentaires
        type: object
        list: true
        fields:
          - { name: titre, label: Titre, type: string, required: true }
          - { name: texte, label: Texte, type: text }
          - { name: lien, label: Lien vers le texte officiel, type: string }
          - { name: source, label: Nom de la source (ex. Décret 2002-8), type: string }
      - name: elections
        label: Élections professionnelles
        type: object
        fields:
          - { name: actif, label: Afficher le bloc Élections, type: boolean }
          - { name: titre, label: Titre, type: string }
          - { name: dateScrutin, label: Jour du scrutin, type: date, options: { format: yyyy-MM-dd } }
          - { name: ouvertureVote, label: Début de la période de vote (facultatif), type: date, options: { format: yyyy-MM-dd } }
          - { name: afficherDepuisJours, label: Afficher le compte à rebours à partir de (jours avant le scrutin), type: number }
          - { name: afficherJusquau, label: Masquer le bloc après cette date, type: date, options: { format: yyyy-MM-dd } }
          - { name: texteIntro, label: Texte d'introduction, type: text }
          - { name: modalites, label: Comment ça se passe dans l'établissement (mode de vote, lieux, horaires), type: text }
          - name: etapes
            label: Mode d'emploi, étape par étape
            type: object
            list: true
            fields:
              - { name: titre, label: Titre, type: string }
              - { name: texte, label: Détail, type: text }
          - { name: appel, label: Message du syndicat (facultatif), type: text }
          - name: questions
            label: Questions fréquentes
            type: object
            list: true
            fields:
              - { name: question, label: Question, type: string }
              - { name: reponse, label: Réponse, type: text }
          - { name: lienOfficiel, label: Lien officiel, type: string }
      - name: paie
        label: Date de paie
        type: object
        description: Règle utilisée par défaut, fin du dernier jour ouvré du mois moins 2 jours. On ajoute une exception quand le service de paie annonce une autre date (décembre, par exemple).
        fields:
          - { name: actif, label: Afficher la date de la prochaine paie, type: boolean }
          - { name: decalageJours, label: Jours avant le dernier jour ouvré du mois, type: number }
          - name: exceptions
            label: Dates particulières
            type: object
            list: true
            fields:
              - { name: mois, label: Mois concerné (AAAA-MM, ex. 2026-12), type: string, pattern: '^\d{4}-\d{2}$' }
              - { name: date, label: Date de paie, type: date, options: { format: yyyy-MM-dd } }
          - { name: note, label: Précision affichée sous la date, type: text }
      - name: statistiques
        label: Statistiques d'installation (facultatif)
        type: object
        description: Compte seulement « première ouverture » et « appli installée », sans aucune donnée personnelle. Laisser vide pour désactiver.
        fields:
          - { name: goatcounter, label: Code GoatCounter (la partie avant .goatcounter.com), type: string }
      - name: responsablePublication
        label: Responsable de la publication (mentions légales)
        type: string
      - name: adressePostale
        label: Adresse du syndicat (mentions légales)
        type: string

  - name: codes
    label: Codes horaires
    type: file
    path: config/codes.json
    format: json
    list: true
    fields:
      - { name: code, label: Code (tel qu'il apparaît sur le planning), type: string, required: true }
      - { name: libelle, label: Libellé, type: string }
      - name: type
        label: Type
        type: select
        required: true
        options:
          values:
            - { value: travail, label: Travail de jour }
            - { value: nuit, label: Travail de nuit }
            - { value: repos, label: Repos }
            - { value: rtt, label: RTT }
            - { value: conge, label: Congé }
            - { value: recup, label: Récupération }
            - { value: cet, label: Jour pris sur le CET }
            - { value: assimile, label: Absence comptée (maladie, formation…) }
            - { value: greve, label: Grève }
      - name: couleur
        label: Couleur dans le planning (horaires de travail)
        type: select
        options:
          values:
            - { value: '', label: Automatique }
            - { value: ocre, label: Ocre }
            - { value: sarcelle, label: Vert d'eau }
            - { value: brique, label: Brique }
            - { value: prune, label: Prune }
            - { value: olive, label: Olive }
            - { value: indigo, label: Indigo (nuit) }
      - name: compte
        label: Compteur particulier
        type: select
        options:
          values:
            - { value: '', label: Aucun }
            - { value: rh, label: Repos hebdomadaire (RH) }
            - { value: ge, label: Garde d'enfant (GE) }
      - { name: debut, label: Début (HH:MM), type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$' }
      - { name: fin, label: Fin (HH:MM), type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$' }
      - { name: pauseMin, label: Pause non comptée (minutes), type: number }
      - { name: debut2, label: Reprise (service coupé), type: string }
      - { name: fin2, label: Fin de la reprise, type: string }

  - name: regles
    label: Règles de calcul
    type: file
    path: config/regles.json
    format: json
    fields:
      - { name: valeurJourneeHeures, label: Valeur d'une journée (heures), type: number }
      - { name: quotiteParDefaut, label: Quotité par défaut (%), type: number }
      - { name: rttParAn, label: RTT par an (temps plein), type: number }
      - { name: caParAn, label: Congés annuels par an (temps plein), type: number }
      - name: periodeEstivale
        label: Période estivale (MM-JJ)
        type: object
        fields:
          - { name: debut, label: Début, type: string }
          - { name: fin, label: Fin, type: string }
      - { name: amplitudeMaxHeures, label: Amplitude maximale d'une journée (h), type: number }
      - { name: dureeContinueMaxJourHeures, label: Durée continue max. équipe de jour (h), type: number }
      - { name: dureeContinueMaxNuitHeures, label: Durée continue max. équipe de nuit (h), type: number }
      - { name: amplitudeServiceCoupeHeures, label: Amplitude max. service coupé (h), type: number }
      - { name: vacationMinHeures, label: Durée min. d'une vacation (h), type: number }
      - { name: reposQuotidienMinHeures, label: Repos quotidien minimum (h), type: number }
      - { name: reposHebdoMinHeures, label: Repos hebdomadaire minimum (h), type: number }
      - { name: maxSeptJoursHeures, label: Maximum sur 7 jours (h), type: number }
      - { name: reposQuinzaineMinJours, label: Jours de repos par quinzaine, type: number }
      - { name: delaiPrevenanceHeures, label: Délai de prévenance d'un changement de planning (h), type: number }
      - { name: rhParAn, label: Repos hebdomadaires attendus par an, type: number }
      - { name: gardeEnfantJours, label: Jours de garde d'enfant par an (temps plein), type: number }
      - { name: heuresAnnuellesTauxHoraire, label: Heures annuelles pour le taux horaire, type: number }
      - { name: majorationNuitPct, label: Majoration des heures de nuit (%), type: number }
      - { name: indemniteDimancheFerie8h, label: Indemnité dimanche et férié pour 8 h (€), type: number }
      - { name: coefHeuresSup1, label: Coefficient des premières heures supplémentaires, type: number }
      - { name: coefHeuresSup2, label: Coefficient des heures supplémentaires suivantes, type: number }
      - { name: seuilHeuresSup, label: Nombre d'heures au premier coefficient, type: number }
      - { name: maladieTauxPct, label: Traitement versé en arrêt maladie (%), type: number }
      - { name: maladieJoursTauxPlein, label: Nombre de jours à ce taux, type: number }
      - { name: nuitDebut, label: Début des heures de nuit (HH:MM), type: string }
      - { name: nuitFin, label: Fin des heures de nuit (HH:MM), type: string }
      - { name: lundiPentecoteTravaille, label: Lundi de Pentecôte = journée de solidarité travaillée, type: boolean }
      - name: aValider
        label: Valeurs encore provisoires (badge « provisoire » dans l'appli)
        type: string
        list: true
        description: Retirer une ligne quand la valeur est confirmée. Clés possibles, par exemple regles.rttParAn, codes.pause, contacts, elections

  - name: baremes
    label: Barèmes (SMIC, point d'indice, grilles)
    type: file
    path: config/baremes.json
    format: json
    fields:
      - name: pointIndice
        label: Valeur du point d'indice
        type: object
        list: true
        description: Pour un changement, ajouter une ligne avec la date d'effet. L'appli prend la dernière ligne dont la date est passée.
        fields:
          - { name: date, label: Date d'effet, type: date, options: { format: yyyy-MM-dd } }
          - { name: valeur, label: Valeur mensuelle (€), type: number }
          - { name: statut, label: Statut, type: select, options: { values: [{ value: officiel, label: Officiel }, { value: annonce, label: Annoncé (à confirmer) }] } }
          - { name: source, label: Source (texte officiel), type: string }
      - name: indiceMinimum
        label: Indice minimum de traitement
        type: object
        list: true
        fields:
          - { name: date, label: Date d'effet, type: date, options: { format: yyyy-MM-dd } }
          - { name: indice, label: Indice majoré minimum, type: number }
          - { name: statut, label: Statut, type: select, options: { values: [{ value: officiel, label: Officiel }, { value: annonce, label: Annoncé (à confirmer) }] } }
          - { name: source, label: Source, type: string }
      - name: smic
        label: SMIC
        type: object
        list: true
        description: Ajouter une ligne à chaque revalorisation. Le mensuel est calculé (taux horaire × 151,67) si on ne le renseigne pas.
        fields:
          - { name: date, label: Date d'effet, type: date, options: { format: yyyy-MM-dd } }
          - { name: horaire, label: SMIC horaire brut (€), type: number }
          - { name: mensuel, label: SMIC mensuel brut, 35 h (€), type: number }
          - { name: statut, label: Statut, type: select, options: { values: [{ value: officiel, label: Officiel }, { value: annonce, label: Annoncé (à confirmer) }] } }
          - { name: source, label: Source, type: string }
      - name: grilles
        label: Grilles indiciaires (grades et échelons)
        type: object
        list: true
        description: Un grade par ligne, avec ses échelons. Sert à choisir son indice dans Outils › Mon salaire.
        fields:
          - { name: nom, label: Grade (ex. Aide-soignant classe normale), type: string, required: true }
          - { name: source, label: Source (texte officiel), type: string }
          - name: echelons
            label: Échelons, du premier au dernier
            type: object
            list: true
            fields:
              - { name: indice, label: Indice majoré, type: number }
              - { name: duree, label: Durée (ex. 2 ans), type: string }
      - name: aValider
        label: Barèmes à confirmer (affichent « provisoire »)
        type: string
        list: true
        description: Valeurs possibles, smic, grilles, point, indiceMin

  - name: primes
    label: Primes proposées dans « Mon salaire »
    type: file
    path: config/primes.json
    format: json
    fields:
      - name: liste
        label: Primes
        type: object
        list: true
        description: Chaque agent coche celles qu'il touche. Pour ajouter une prime, ajouter une ligne.
        fields:
          - { name: id, label: Identifiant court, sans espace ni accent (ex. prime-tutorat), type: string, required: true, pattern: '^[a-z0-9-]+$' }
          - { name: nom, label: Nom de la prime, type: string, required: true }
          - { name: categorie, label: Rubrique (ex. Ségur et soins, Primes liées au poste), type: string }
          - name: mode
            label: Façon de calculer
            type: select
            required: true
            options:
              values:
                - { value: points, label: Nombre de points d'indice (ex. CTI) }
                - { value: pourcentage, label: Pourcentage du traitement }
                - { value: montant, label: Montant fixe par mois }
                - { value: points-saisis, label: Points d'indice saisis par l'agent (ex. NBI) }
                - { value: saisie, label: Montant saisi par l'agent }
          - { name: valeur, label: Valeur (points, pourcentage ou euros selon la façon de calculer), type: number }
          - { name: aide, label: Explication courte affichée sous le nom, type: text }
          - { name: source, label: Source (texte officiel), type: string }
          - name: statut
            label: Statut
            type: select
            options:
              values:
                - { value: officiel, label: Officiel }
                - { value: annonce, label: À confirmer (affiche « provisoire ») }
      - name: aValider
        label: Autres primes à confirmer (identifiants)
        type: string
        list: true

  # ---- Textes : tout texte affiché peut être changé ici ----

  - name: textes-accueil-site
    label: "Textes · Page d'accueil du site"
    type: file
    path: config/textes-accueil-site.json
    format: json
    fields:
      - name: textes
        label: Textes
        type: object
        list: true
        description: "Change seulement la case Texte (garde les mots entre {accolades} et les signes comme « + »). Ne modifie pas la Clé. Le même texte est remplacé partout où il apparaît."
        fields:
          - name: texte
            label: Texte
            type: text
          - name: cle
            label: Clé (ne pas modifier)
            type: string


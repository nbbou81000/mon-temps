  - name: courriers
    label: Modèles de courriers
    type: file
    path: config/courriers.json
    format: json
    fields:
      - name: formule
        label: Formule de politesse
        type: string
      - name: modeles
        label: Modèles
        type: object
        list: true
        description: "Dans le texte : {dates} {heures} {periode} {delai} {quotite} {jours} {precisions} {service} sont remplacés par ce que l'agent saisit. [[ phrase avec {x} ]] disparaît si {x} est vide. [[ A | B ]] affiche B si A est vide."
        fields:
          - name: titre
            label: Titre
            type: string
          - name: groupe
            label: Groupe
            type: string
          - name: id
            label: Identifiant (ne pas modifier)
            type: string
          - name: champs
            label: Champs demandés à l'agent
            type: string
            list: true
          - name: texte
            label: Texte du courrier
            type: text
